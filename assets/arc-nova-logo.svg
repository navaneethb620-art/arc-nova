<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
<title id="title">ARC-NOVA logo</title>
<desc id="desc">A refined architectural monogram formed from two geometric arches, with ARC-NOVA wordmark.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E7D1A3"/>
    <stop offset="1" stop-color="#B78E52"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9BD0C4"/>
    <stop offset="1" stop-color="#4F938A"/>
  </linearGradient>
</defs>
<!-- architectural frame -->
<path d="M285 270V205Q285 95 395 95H505Q615 95 615 205V270" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round"/>
<path d="M345 270V218Q345 155 408 155H492Q555 155 555 218V270" fill="none" stroke="url(#teal)" stroke-width="12" stroke-linecap="round"/>
<!-- stylized A / rising form -->
<path d="M255 420L450 165L645 420" fill="none" stroke="#F4F2EC" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M355 420L450 292L545 420" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M385 380H515" stroke="#75B9AD" stroke-width="12" stroke-linecap="round"/>
<!-- baseline -->
<path d="M250 465H650" stroke="#52656B" stroke-width="2"/>
<text x="450" y="545" text-anchor="middle" fill="#F4F2EC" font-family="Manrope, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="13">ARC-NOVA</text>
<text x="450" y="590" text-anchor="middle" fill="#D5B47A" font-family="Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="7">DESIGN · VISUALIZE · EXPERIENCE</text>
</svg>